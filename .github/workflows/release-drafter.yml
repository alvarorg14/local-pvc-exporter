name: Release Drafter

on:
  push:
    branches:
      - main

jobs:
  update_release_draft:
    name: Update Stable Release Draft
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7
        with:
          config-name: release-drafter-template.yml
          prerelease: false
          include-pre-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_prerelease_draft:
    name: Update Prerelease Draft
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7
        with:
          config-name: release-drafter-template.yml
          prerelease: true
          prerelease-identifier: rc
          include-pre-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}